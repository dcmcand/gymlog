name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          KEYSTORE_FILE: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk

  # Publishes the Alloy watchapp to the Pebble appstore. Requires the PEBBLE_REFRESH_TOKEN
  # secret (the refresh token from a local `pebble login`); the workflow mints a short-lived
  # id token from it, using the PEBBLE_FIREBASE_API_KEY secret (Pebble's public Firebase
  # client key - kept as a secret to stay out of source and CI logs).
  # NOTE: bump pebble/package.json "version" each release (the appstore rejects a non-increasing
  # version). This job is validated on the first real release.
  publish-pebble:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Pebble toolchain
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pebble-tool and SDK
        run: |
          uv tool install pebble-tool
          pebble sdk install latest

      - name: Align watchapp version with the release tag
        working-directory: pebble
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MA MI PA <<< "$RAW"
          VERSION="${MA:-1}.${MI:-0}.${PA:-0}"
          echo "PEBBLE_VERSION=$VERSION" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "watchapp version set to $VERSION"

      - name: Build watchapp
        working-directory: pebble
        run: pebble build

      - name: Publish to the Pebble appstore
        working-directory: pebble
        env:
          PEBBLE_REFRESH_TOKEN: ${{ secrets.PEBBLE_REFRESH_TOKEN }}
          FIREBASE_API_KEY: ${{ secrets.PEBBLE_FIREBASE_API_KEY }}
        run: |
          ID_TOKEN=$(curl -s "https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=${PEBBLE_REFRESH_TOKEN}" | jq -r .id_token)
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "Failed to mint a Pebble id token from the refresh token"; exit 1
          fi
          DESC="See your rest timer and current set on your wrist. Finish a set in the GymLog Android app and the watch shows the exercise, your target weight and reps, and which set you're on, with a live rest countdown. Log the set as Easy or Hard, skip to another exercise if a machine is taken, extend the rest, or feel a buzz when the rest ends, all from the watch. It works offline over Bluetooth through the Pebble app, with no internet or account needed. Requires the GymLog Android app."
          pebble publish --non-interactive --is-published \
            --firebase-id-token "$ID_TOKEN" \
            --name "GymLog" --version "$PEBBLE_VERSION" --category health \
            --source "https://github.com/dcmcand/gymlog" \
            --description "$DESC" \
            --icon-large appstore/icon-large.png --icon-small appstore/icon-small.png \
            --screenshots appstore/emery_rest.png appstore/emery_done.png \
            --no-gif-all-platforms \
            --release-notes "Release ${GITHUB_REF_NAME}"
